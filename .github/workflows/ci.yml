name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    # Daily rebuild so events, jobs and sponsors stay current without commits.
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Production must not ship any TBD(mike) placeholder. Analytics IDs are
      # repository variables (Settings > Secrets and variables > Actions >
      # Variables); left unset, the site loads no analytics.
      - name: Build site
        run: npm run build
        env:
          STRICT_TBD: "1"
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_ADS_ID: ${{ vars.PUBLIC_ADS_ID }}
          PUBLIC_ADS_CONVERSIONS: ${{ vars.PUBLIC_ADS_CONVERSIONS }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin to the wrangler version in package-lock.json: the @astrojs/cloudflare
          # adapter generates config for it, and floating to latest has broken
          # deploys before. Bump this whenever the lockfile's wrangler changes.
          wranglerVersion: "4.151.0"
          command: deploy --config dist/client/wrangler.json

  # Uploads a pull request's build as a preview version without deploying it.
  # Placeholders are allowed and analytics stay off. The preview URLs are posted
  # as a comment on the pull request, updated on each push.
  preview:
    name: Preview on Cloudflare
    runs-on: ubuntu-latest
    needs: quality
    # Fork PRs get no secrets, so they can't upload.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
          command: versions upload --config dist/client/wrangler.json --preview-alias pr-${{ github.event.number }}

      # The alias URL stays the same across pushes; the version URL is this
      # commit's build. Edits the bot's earlier comment instead of adding more.
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.upload.outputs.command-output }}
          PR: ${{ github.event.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          alias_url=$(grep -oP 'Version Preview Alias URL: \K\S+' <<<"$OUTPUT" || true)
          version_url=$(grep -oP 'Version Preview URL: \K\S+' <<<"$OUTPUT" || true)
          if [ -z "$alias_url$version_url" ]; then
            echo "No preview URL in wrangler output" >&2
            exit 1
          fi
          body="**Preview:** ${alias_url:-$version_url}"
          [ -n "$alias_url" ] && [ -n "$version_url" ] && body+=$'\n\n'"This commit (${SHA:0:7}): $version_url"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"

  # GitHub turns off scheduled workflows in public repos after 60 days without
  # repository activity, which would stop the daily rebuild. Re-enabling the
  # workflow on each scheduled run keeps it on.
  keepalive:
    name: Keep the daily rebuild enabled
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      actions: write

    steps:
      - name: Re-enable this workflow
        run: gh workflow enable ci.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
